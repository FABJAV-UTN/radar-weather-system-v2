version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: radar_db
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: